<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Incidence collapse comparison</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#303740;font:14px system-ui,sans-serif}main{max-width:1250px;margin:30px auto;padding:0 20px}form{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;padding:18px;background:white;border:1px solid #dce0e5;border-radius:8px}label{display:flex;align-items:center;gap:8px}input{width:130px}output{min-width:60px;font-variant-numeric:tabular-nums;font-size:12px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}section{min-width:0;background:white;border:1px solid #dce0e5;border-radius:8px;overflow:hidden}h2{font-size:15px;font-weight:500;margin:0;padding:14px 18px;border-bottom:1px solid #eceef1}canvas{display:block;width:100%;height:470px}#status{display:block;min-height:20px;font-size:12px;color:#657080;margin:10px 2px}@media(max-width:750px){.panels{grid-template-columns:1fr}canvas{height:360px}main{margin:15px auto}}
</style>
<main>
<form aria-label="Comparison parameters" onsubmit="return false">
<select id="path" aria-label="Wall approach"><option value="coordinate">β₁⁽²⁾ → 0</option><option value="positive">β₂⁽²⁾ → 1</option></select>
<label for="r">r <input id="r" type="range" min="0" max="1" step=".001" value=".35"><output for="r"></output></label>
<label for="theta">θ <input id="theta" type="range" min="0" max="6.283185307179586" step=".001" value="0"><output for="theta"></output></label>
<label for="t">t <input id="t" type="range" min="0" max=".99" step=".001" value="0"><output for="t"></output></label>
<label for="phi">φ <input id="phi" type="range" min="0" max="6.283185307179586" step=".001" value="0"><output for="phi"></output></label>
<label for="beta"><span id="beta-label">β₁⁽²⁾</span> <input id="beta" type="range" min="0" max="1" step=".001" value="0"><output for="beta"></output></label>
</form>
<div class="panels"><section><h2>Current</h2><canvas id="current" role="img" aria-label="Current incidence diagram"></canvas></section><section><h2>Proposed · experimental</h2><canvas id="proposed" role="img" aria-label="Proposed incidence diagram"></canvas></section></div>
<span id="status" role="status" aria-live="polite"></span>
</main>
<script type="module" src="./collapse-preview.js"></script>
</html>
