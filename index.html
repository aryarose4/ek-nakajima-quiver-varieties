<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eₖ Nakajima Quiver Varieties</title>
<meta name="description" content="Interactive explorer of the four-dimensional Nakajima quiver varieties of affine ADE type — the ALE gravitational instantons.">
<link rel="icon" href="assets/img/Star-Shaped_Quiver.jpg">
<script>
  window.MathJax = {
    tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]], displayMath: [["$$", "$$"], ["\\[", "\\]"]] },
    svg: { fontCache: "global" },
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  :root {
    /* al-folio dark palette (--global-* in _themes.scss) so the widget blends
       with the host site instead of reading as blue-slate. */
    --bg: #1c1c1d;
    --fg: #e8e8e8;
    --muted: #828282;
    --panel: #212529;
    --border: #424246;
    --accent: #2698ba;
  }
  [data-theme="light"] {
    --bg: #ffffff;
    --fg: #151a22;
    --muted: #828282;
    --panel: #ffffff;
    --border: #e6e6e6;
    --accent: #2f6fd0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 20px 72px; }
  header.hero { display: flex; align-items: center; gap: 18px; margin-bottom: 8px; }
  header.hero img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; }
  header.hero h1 { font-size: 1.9rem; margin: 0; letter-spacing: -0.01em; }
  header.hero .sub { color: var(--muted); margin: 2px 0 0; font-size: 0.95rem; }
  .intro { max-width: 920px; color: var(--fg); margin: 18px 0 8px; }
  .intro p { margin: 0.7em 0; }
  .note { color: var(--muted); font-size: 0.92rem; }
  #ek-nakajima-widget { margin-top: 22px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 0.85rem; border-top: 1px solid var(--border); padding-top: 16px; }
  footer a { color: var(--accent); }
  body.ek-bare .topbar,
  body.ek-bare header.hero,
  body.ek-bare footer { display: none; }
  body.ek-bare .wrap { padding: 0; max-width: none; }
  body.ek-bare #ek-nakajima-widget { margin-top: 0; }
  .topbar { display: flex; justify-content: flex-end; }
  button.theme-toggle {
    background: var(--panel); color: var(--fg); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 0.85rem;
  }
  button.theme-toggle:hover { border-color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><button class="theme-toggle" id="theme-toggle" type="button">Light / dark</button></div>

  <header class="hero">
    <img src="assets/img/Star-Shaped_Quiver.jpg" alt="Affine quiver diagram">
    <div>
      <h1>E<sub>k</sub> Nakajima Quiver Varieties</h1>
      <p class="sub">The ALE gravitational instantons of affine E<sub>6</sub>, E<sub>7</sub>, E<sub>8</sub></p>
    </div>
  </header>

  <div id="ek-nakajima-widget"></div>

  <footer>
    Interactive explorer of the four-dimensional Nakajima quiver varieties of
    affine E<sub>6</sub>/E<sub>7</sub>/E<sub>8</sub> type. See the repository README for the mathematical
    background, architecture and tests.
  </footer>
</div>

<script src="assets/js/ek-nakajima/lib/three.min.js"></script>
<script src="assets/js/ek-nakajima/lib/OrbitControls.js"></script>
<script type="module" src="assets/js/ek-nakajima/widget.js"></script>
<script>
  (function () {
    var toggle = document.getElementById("theme-toggle");
    toggle.addEventListener("click", function () {
      var root = document.documentElement;
      root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    var params = new URLSearchParams(location.search);
    if (params.has("bare")) document.body.classList.add("ek-bare");
    if (params.get("theme") === "light" || params.get("theme") === "dark") document.documentElement.setAttribute("data-theme", params.get("theme"));
    else {
      var stored = null;
      try { stored = localStorage.getItem("theme"); } catch (e) {}
      if (stored === "dark" || stored === "light") document.documentElement.setAttribute("data-theme", stored);
    }

    // Trust the immediate parent and its known origin. Measure content rather
    // than scrollHeight, which cannot shrink below the iframe viewport height.
    if (window.parent !== window) {
      var parentOrigin = null;
      try {
        if (document.referrer) parentOrigin = new URL(document.referrer).origin;
        else if (location.ancestorOrigins && location.ancestorOrigins.length) parentOrigin = location.ancestorOrigins[0];
      } catch (e) {}
      if (parentOrigin && parentOrigin !== "null") {
        var wrap = document.querySelector(".wrap");
        var lastHeight = null;
        var heightPending = false;
        function reportHeight() {
          heightPending = false;
          var height = Math.ceil(wrap.getBoundingClientRect().height);
          if (!isFinite(height) || height <= 0 || height === lastHeight) return;
          lastHeight = height;
          window.parent.postMessage({ type: "ek-nakajima-height", height: height }, parentOrigin);
        }
        function scheduleHeight() {
          if (heightPending) return;
          heightPending = true;
          window.requestAnimationFrame(reportHeight);
        }
        window.addEventListener("message", function (event) {
          var data = event.data;
          if (event.source !== window.parent || event.origin !== parentOrigin || !data ||
              data.type !== "ek-nakajima-theme" || (data.theme !== "light" && data.theme !== "dark")) return;
          document.documentElement.setAttribute("data-theme", data.theme);
          scheduleHeight();
        });
        if (window.ResizeObserver) new ResizeObserver(scheduleHeight).observe(wrap);
        else if (window.MutationObserver) new MutationObserver(scheduleHeight).observe(wrap, { childList: true, subtree: true, attributes: true });
        window.addEventListener("resize", scheduleHeight);
        window.addEventListener("load", scheduleHeight);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleHeight);
        scheduleHeight();
      }
    }

    // Optional state freeze for screenshots: ?type=E6&r=0.5&theta=0
    var hasState = ["type", "r", "theta", "t", "phi"].some(function (k) { return params.has(k); });
    if (!hasState) return;

    function apply() {
      var sliders = document.querySelectorAll("#ek-nakajima-widget .ek-slider");
      if (!sliders.length) { setTimeout(apply, 50); return; }
      var type = params.get("type");
      if (type) {
        var tabs = document.querySelectorAll("#ek-nakajima-widget .ek-tab");
        for (var i = 0; i < tabs.length; i++) {
          if (tabs[i].textContent === type) { tabs[i].click(); break; }
        }
      }
      function set(i, v) {
        if (i >= sliders.length || v == null || sliders[i].disabled) return;
        sliders[i].value = v;
        sliders[i].dispatchEvent(new Event("input", { bubbles: true }));
      }
      set(0, params.get("r"));
      set(1, params.get("theta"));
      set(2, params.get("t"));
      set(3, params.get("phi"));
      document.documentElement.setAttribute("data-ek-ready", "1");
    }
    apply();
  })();
</script>
</body>
</html>
